# Lean's colors and its goals beside a file, as a plugin built for WebAssembly:
# ghostwrite-dev/plugin-build's build.sh.
[package]
name = "ghostwrite-lean-plugin"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ghostwrite-plugin-api = { git = "https://github.com/ghostwrite-dev/ghostwrite", tag = "plugin-api-v1.0.0" }
wit-bindgen = "0.57"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
